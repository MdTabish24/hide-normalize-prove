<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play: attack by attack</title>
<link rel="stylesheet" href="/static/play.css">
<script src="/static/play.js" defer></script>
</head>
<body>
<div class="wrap">
  <h1>Team Ctrl Alt Elite: Hide, Normalize, Prove</h1>
  <p class="note">Pick an attack. Press <b>Run simulation</b> (or Space): both panels play at the same time. Press <b>Next</b> (or the right arrow) for the next attack. Numbers come from our saved test files (mock = fake model, real = DeepSeek, small samples, one laptop).</p>
  <div class="nav" id="nav"></div>
  <h2 id="title"></h2>
  <p id="attack"></p>
  <div class="ctrl"><button id="back">&larr; Back</button><button id="run" class="go">&#9654; Run simulation</button><button id="next">Next &rarr;</button></div>
  <div class="panels" id="panels"></div>
  <div class="blk" id="fix"></div>
  <p id="result"></p>
  <p class="note" id="src"></p>
</div>
</body>
</html>
